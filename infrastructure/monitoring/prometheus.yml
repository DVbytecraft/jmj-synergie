global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "jmj-synergie"
    environment: "production"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # ── API FastAPI ────────────────────────────────────────────────────────────
  - job_name: "jmj_backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── PostgreSQL (via postgres_exporter) ────────────────────────────────────
  - job_name: "jmj_postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
    scrape_interval: 30s

  # ── Redis (via redis_exporter) ─────────────────────────────────────────────
  - job_name: "jmj_redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
    scrape_interval: 30s

  # ── Prometheus lui-même ───────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 60s
