databases:
  - name: jmj-db
    databaseName: jmj
    user: jmj_admin
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: keyvalue
    name: jmj-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: jmj-backend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jmj-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STORAGE_PATH
        value: /app/storage
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jmj-cache
          property: connectionString
      - key: USE_CLOUDINARY
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_NAME
        value: JMJ Synergie
      - key: COMPANY_NAME
        value: JMJ Synergie
      - key: COMPANY_ADDRESS
        value: "Lome, Togo"
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_CITY
        value: "Lome"
      - key: COMPANY_COUNTRY
        value: "Togo"
      - key: COMPANY_TAX_ID
        value: "1001701669"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur JMJ Synergie
      - key: SENTRY_DSN
        sync: false
      - key: WORKERS
        value: "1"
      - key: METRICS_TOKEN
        sync: false
      - key: METRICS_ALLOWED_IPS
        sync: false

  - type: web
    name: jmj-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: jmj-backend
          property: hostport
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: RENDER_BACKEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: KEEPALIVE_SECRET
        sync: false
