# ─────────────────────────────────────────────────────────────────────────────
#  Biloz — Render Blueprint
#  1. Connecter ce repo sur https://dashboard.render.com/blueprints
#  2. Après le premier déploiement, noter l'URL du backend et mettre à jour
#     NEXT_PUBLIC_API_URL + ALLOWED_ORIGINS dans le dashboard Render.
#  3. Renseigner toutes les variables marquées "sync: false" dans le dashboard.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: biloz-db
    databaseName: biloz
    user: biloz_admin
    plan: starter
    region: frankfurt

services:

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  - type: web
    name: biloz-backend
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # DATABASE_URL injectée automatiquement depuis la base Render (postgres://)
      # start.sh la convertit en postgresql+asyncpg:// au démarrage
      - key: DATABASE_URL
        fromDatabase:
          name: biloz-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        sync: false           # Ex: https://biloz-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false           # Ex: https://biloz-frontend.onrender.com
      - key: STORAGE_PATH
        value: /app/storage
      - key: MAX_FILE_SIZE_MB
        value: "10"
      # ── Brevo ────────────────────────────────────────────────────────────────
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: biloz@bytecraft.art
      - key: BREVO_SENDER_NAME
        value: Biloz
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: biloz@bytecraft.art
      - key: SMTP_TLS
        value: "true"
      # ── Cloudinary ───────────────────────────────────────────────────────────
      - key: USE_CLOUDINARY
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── AI OCR ───────────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Infos société ─────────────────────────────────────────────────────────
      - key: APP_NAME
        value: Biloz
      - key: COMPANY_NAME
        value: Biloz
      - key: COMPANY_ADDRESS
        value: "Cotonou, Bénin"
      - key: COMPANY_PHONE
        value: "+229 00 00 00 00"
      - key: COMPANY_EMAIL
        value: biloz@bytecraft.art
      - key: SENTRY_DSN
        sync: false

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  - type: web
    name: biloz-frontend
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      # BACKEND_URL : URL interne du backend — baked dans les rewrites Next.js au build
      # ⚠️  Déployer le backend en premier, puis renseigner son URL ici avant de déployer le frontend
      - key: BACKEND_URL
        sync: false           # Ex: https://biloz-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1        # Toujours relatif — le proxy Next.js gère la redirection
      - key: NEXTAUTH_URL
        sync: false           # Ex: https://biloz-frontend.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
