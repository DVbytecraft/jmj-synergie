version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Biloz — Docker Compose DEV
#  Usage : docker compose -f docker-compose.dev.yml up --build
#
#  Différences vs production :
#   - Redis sans password (dev only)
#   - Pas de Nginx (accès direct aux ports)
#   - Hot reload backend (--reload) et frontend (next dev)
#   - Code monté en volume (pas de COPY dans l'image)
#   - HTTP uniquement (pas de SSL)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis — rate limiter ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: biloz_dev_redis
    restart: unless-stopped
    networks:
      - biloz_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: biloz_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biloz}
      POSTGRES_USER: ${POSTGRES_USER:-biloz_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - biloz_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biloz_admin} -d ${POSTGRES_DB:-biloz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend — hot reload ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: biloz_dev_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-biloz_admin}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-biloz}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_not_for_production_32chars_ok}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "http://localhost:${DEV_FRONTEND_PORT:-3001},http://localhost:3000"
      STORAGE_PATH: /app/storage
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./backend:/app
      - backend_storage_dev:/app/storage
    ports:
      - "${DEV_BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - biloz_dev
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app

  # ── Next.js Frontend — next dev ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: biloz_dev_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # File-watching polling — obligatoire sur macOS avec volumes Docker (pas d'inotify)
      # Sans ça, Next.js détecte des changements fantômes et recompile en cours de route → ChunkLoadError
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${DEV_FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - biloz_dev
    command: npm run dev

volumes:
  postgres_dev_data:
    driver: local
  backend_storage_dev:
    driver: local

networks:
  biloz_dev:
    driver: bridge
